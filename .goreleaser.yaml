version: 2

project_name: boxt

builds:
  - id: boxt
    main: ./cmd/boxt
    binary: boxt
    env:
      - CGO_ENABLED=0
    goos:
      - darwin
      - linux
    goarch:
      - arm64
      - amd64
    ldflags:
      - -s -w -X github.com/daveagill/boxt/internal/cli.Version={{ .Version }}

archives:
  - name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}"
    formats:
      - tar.gz

brews:
  - name: boxt
    repository:
      owner: daveagill
      name: homebrew-tap
      token: "{{ .Env.HOMEBREW_TAP_GITHUB_TOKEN }}"
    directory: Formula
    homepage: "https://github.com/daveagill/boxt"
    description: "Local-first Linux development environments for coding agents"
    install: |
      bin.install "boxt"
    test: |
      system "#{bin}/boxt", "version"
    dependencies:
      - name: lima
      - name: git

checksum:
  name_template: checksums.txt

snapshot:
  version_template: "{{ incpatch .Version }}-next"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
